<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Gestão</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="container">
    <header>
        <h1>Gestão de Estoque</h1>
        <p>CRUD completo com autenticação JWT e API REST</p>
    </header>

    <section id="auth-panel" class="card">
        <h2>Entrar ou criar conta</h2>
        <form id="login-form">
            <input id="login-username" placeholder="Usuário" required />
            <input id="login-password" type="password" placeholder="Senha" required />
            <button type="submit">Entrar</button>
        </form>
        <form id="register-form">
            <input id="register-username" placeholder="Novo usuário" required />
            <input id="register-password" type="password" placeholder="Nova senha" required />
            <button type="submit">Cadastrar</button>
        </form>
    </section>

    <section id="dashboard" class="hidden">
        <div class="card">
            <div class="toolbar">
                <h2>Produtos</h2>
                <button id="logout-btn">Sair</button>
            </div>
            <form id="product-form">
                <input id="product-id" type="hidden" />
                <input id="product-name" placeholder="Nome do produto" required />
                <input id="product-description" placeholder="Descrição" />
                <input id="product-quantity" type="number" placeholder="Quantidade" required />
                <input id="product-price" type="number" step="0.01" placeholder="Preço" required />
                <input id="product-category" placeholder="Categoria" required />
                <button type="submit">Salvar</button>
                <button type="button" id="cancel-edit">Cancelar</button>
            </form>
            <table>
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Qtd</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody id="product-list"></tbody>
            </table>
        </div>
    </section>
</div>
<script src="/js/app.js"></script>
</body>
</html>
