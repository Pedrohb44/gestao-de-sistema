spring.datasource.url=${DB_URL:jdbc:h2:mem:gestao_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
# spring.datasource.password=${DB_PASSWORD:REDACTED}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
# app.jwt.secret=${JWT_SECRET:REDACTED}
app.jwt.secret-name=${JWT_SECRET_NAME:jwt-signing-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Replace ${KEY_VAULT_NAME} with your actual Azure Key Vault name
azure.keyvault.uri=https://${KEY_VAULT_NAME}.vault.azure.net
azure.keyvault.identity.client-id=${AZURE_CLIENT_ID:}
