spring.datasource.url=${DB_URL:jdbc:h2:mem:gestao_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.azure.passwordless-enabled=${AZURE_POSTGRES_PASSWORDLESS_ENABLED:false}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
spring.cloud.azure.credential.managed-identity-enabled=${AZURE_MANAGED_IDENTITY_ENABLED:false}
spring.cloud.azure.credential.client-id=${AZURE_CLIENT_ID:}
spring.cloud.azure.profile.tenant-id=${AZURE_TENANT_ID:}
# Azure Database for PostgreSQL passwordless settings:
# spring.datasource.url=jdbc:postgresql://${POSTGRESQL_SERVER}.postgres.database.azure.com:${POSTGRESQL_PORT}/${POSTGRESQL_DATABASE}?sslmode=require
# spring.datasource.username=${MANAGED_IDENTITY_NAME}
# spring.datasource.azure.passwordless-enabled=true
# spring.cloud.azure.credential.managed-identity-enabled=true
# spring.cloud.azure.credential.client-id=${AZURE_CLIENT_ID:}
# For Azure sovereign clouds, set spring.cloud.azure.profile.cloud-type and spring.datasource.azure.scopes accordingly.
app.jwt.secret=${JWT_SECRET:local-development-secret-key-32-chars-min}
app.jwt.secret-name=${JWT_SECRET_NAME:jwt-signing-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
azure.keyvault.enabled=${AZURE_KEYVAULT_ENABLED:false}
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
azure.keyvault.identity.client-id=${AZURE_CLIENT_ID:}
