services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gestao_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/gestao_db
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: super-secret-key-for-gestao-app
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"

volumes:
  pgdata:
